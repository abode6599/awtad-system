<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>أوتاد | نظام إدارة المعسكرات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#060e0a; --bg2:#0a1510; --card:#0f1f14; --card2:#142019;
  --border:#1a3520; --border2:#245030;
  --green:#3ddc84; --green2:#2db870; --green3:#c8f5dc;
  --gold:#f0b429; --gold2:#d4960f;
  --red:#f2415a; --blue:#4da6ff; --purple:#b58af5; --orange:#ff8c42;
  --text:#dff5e8; --text2:#7aaa8a; --text3:#3a6045;
  --camp-hajj:#f0b429; --camp-scout:#3ddc84;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{outline:none;-webkit-appearance:none;appearance:none;}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 50% -5%,rgba(61,220,132,.08) 0%,transparent 65%),
    radial-gradient(ellipse 40% 30% at 85% 85%,rgba(240,180,41,.05) 0%,transparent 55%),
    radial-gradient(ellipse 30% 30% at 15% 70%,rgba(77,166,255,.04) 0%,transparent 55%);
}
::-webkit-scrollbar{width:3px;} ::-webkit-scrollbar-track{background:var(--bg);} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}

/* ══════ LOGIN ══════ */
#login-screen{position:fixed;inset:0;z-index:9999;background:var(–bg);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-wrap{width:100%;max-width:360px;text-align:center;}
.login-logo{font-family:‘Tajawal’,sans-serif;font-size:56px;font-weight:900;color:var(–green);letter-spacing:-3px;line-height:1;text-shadow:0 0 50px rgba(61,220,132,.45);}
.login-tagline{font-size:11px;color:var(–text3);letter-spacing:3px;margin-bottom:6px;}
.login-version{font-size:10px;color:var(–border2);margin-bottom:32px;}
.login-box{background:var(–card);border:1px solid var(–border2);border-radius:24px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:28px;}
.pin-dot{width:13px;height:13px;border-radius:50%;background:var(–border2);border:2px solid var(–border2);transition:all .2s;}
.pin-dot.on{background:var(–green);border-color:var(–green);box-shadow:0 0 12px rgba(61,220,132,.6);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.nb{background:var(–card2);border:1px solid var(–border);border-radius:13px;padding:17px;font-size:21px;font-weight:700;color:var(–text);cursor:pointer;transition:all .15s;font-family:‘Cairo’,sans-serif;}
.nb:active{transform:scale(.91);background:var(–border);}
.nb.del{font-size:15px;color:var(–text2);}
.nb.ok{background:var(–green2);color:#000;font-size:14px;font-weight:900;border:none;}
.login-err{color:var(–red);font-size:12px;margin-top:12px;min-height:16px;}
.login-reset{margin-top:36px;color:var(–border2);font-size:10px;cursor:pointer;letter-spacing:1px;}

/* ══════ APP SHELL ══════ */
#app{display:none;position:relative;z-index:1;padding-bottom:76px;}
.header{
position:sticky;top:0;z-index:100;
background:rgba(6,14,10,.9);backdrop-filter:blur(18px);
border-bottom:1px solid var(–border);padding:12px 16px;
display:flex;align-items:center;justify-content:space-between;
}
.h-left{display:flex;align-items:center;gap:10px;}
.h-avatar{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;border:2px solid currentColor;flex-shrink:0;}
.h-name{font-size:14px;font-weight:700;}
.h-meta{font-size:10px;color:var(–text2);margin-top:1px;}
.h-right{display:flex;gap:6px;}
.ibtn{height:34px;padding:0 10px;border-radius:9px;background:var(–card2);border:1px solid var(–border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(–text2);font-family:‘Cairo’,sans-serif;font-weight:700;transition:all .2s;gap:4px;}
.ibtn:active{transform:scale(.9);}

/* ══════ NAV ══════ */
nav{position:fixed;bottom:0;width:100%;z-index:1000;background:var(–card);border-top:1px solid var(–border);display:flex;justify-content:space-around;align-items:center;padding:7px 0 13px;}
.ni{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(–text3);font-size:9px;font-weight:700;cursor:pointer;padding:4px 6px;border-radius:11px;transition:all .2s;min-width:46px;}
.ni-icon{font-size:19px;transition:transform .2s;display:block;}
.ni.active{color:var(–green);}
.ni.active .ni-icon{transform:translateY(-2px);}

/* ══════ PAGES ══════ */
.page{display:none;padding:14px;max-width:700px;margin:0 auto;}
.page.active{display:block;}

/* ══════ CARDS ══════ */
.card{background:var(–card);border:1px solid var(–border);border-radius:var(–r);padding:16px;margin-bottom:10px;position:relative;overflow:hidden;}
.sec{font-size:10px;font-weight:700;color:var(–text3);letter-spacing:2px;margin:18px 0 9px;display:flex;align-items:center;gap:8px;}
.sec::after{content:’’;flex:1;height:1px;background:var(–border);}

/* ══════ BUTTONS & INPUTS ══════ */
.btn{width:100%;padding:14px;border-radius:13px;border:none;font-weight:900;font-size:14px;cursor:pointer;font-family:‘Cairo’,sans-serif;transition:all .2s;margin-top:8px;}
.btn:active{transform:scale(.97);}
.btn-g{background:var(–green2);color:#000;}
.btn-gold{background:var(–gold2);color:#000;}
.btn-r{background:var(–red);color:#fff;}
.btn-ghost{background:var(–card2);color:var(–text);border:1px solid var(–border);}
.btn-blue{background:var(–blue);color:#000;}
.btn-sm{padding:9px 14px;font-size:12px;width:auto;margin:0;}
input,select,textarea{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(–border2);background:var(–bg2);color:var(–text);font-size:14px;font-family:‘Cairo’,sans-serif;margin-top:8px;transition:border .2s;}
input:focus,select:focus,textarea:focus{border-color:var(–green);}
textarea{resize:none;min-height:70px;}
select option{background:var(–card);}
label{font-size:12px;color:var(–text2);font-weight:600;display:block;margin-top:12px;}

/* ══════ BADGES ══════ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;font-size:10px;font-weight:700;}
.bg-g{background:rgba(61,220,132,.15);color:var(–green);}
.bg-gold{background:rgba(240,180,41,.15);color:var(–gold);}
.bg-r{background:rgba(242,65,90,.15);color:var(–red);}
.bg-b{background:rgba(77,166,255,.15);color:var(–blue);}
.bg-p{background:rgba(181,138,245,.15);color:var(–purple);}
.bg-o{background:rgba(255,140,66,.15);color:var(–orange);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot-g{background:var(–green);box-shadow:0 0 7px var(–green);}
.dot-r{background:var(–red);box-shadow:0 0 7px var(–red);}
.dot-gold{background:var(–gold);}
.hidden{display:none!important;}

/* ══════ CAMP CARDS ══════ */
.camp-card{
border-radius:var(–r);padding:18px;margin-bottom:10px;cursor:pointer;
position:relative;overflow:hidden;transition:all .2s;
border:1px solid var(–border2);
}
.camp-card:active{transform:scale(.98);}
.camp-card.hajj{background:linear-gradient(135deg,rgba(240,180,41,.12),rgba(240,180,41,.04));border-color:rgba(240,180,41,.3);}
.camp-card.scout{background:linear-gradient(135deg,rgba(61,220,132,.1),rgba(61,220,132,.03));border-color:rgba(61,220,132,.25);}
.camp-card.active-camp{box-shadow:0 0 0 2px var(–green);}
.camp-type-tag{font-size:10px;font-weight:700;letter-spacing:1.5px;margin-bottom:8px;}
.camp-name{font-size:18px;font-weight:900;line-height:1.2;}
.camp-meta{font-size:11px;color:var(–text2);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;}
.camp-stats{display:flex;gap:12px;margin-top:12px;}
.camp-stat{text-align:center;background:rgba(0,0,0,.2);border-radius:10px;padding:8px 14px;flex:1;}
.camp-stat-n{font-size:20px;font-weight:900;}
.camp-stat-l{font-size:10px;color:var(–text3);margin-top:2px;}
.camp-progress{height:3px;background:var(–border);border-radius:3px;margin-top:12px;overflow:hidden;}
.camp-progress-bar{height:100%;border-radius:3px;transition:width .5s;}

/* ══════ MEMBER ROWS ══════ */
.mrow{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;background:var(–card2);border:1px solid var(–border);margin-bottom:5px;cursor:pointer;transition:all .2s;}
.mrow:active{transform:scale(.98);}
.mav{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.mname{font-size:13px;font-weight:700;}
.mrank{font-size:10px;color:var(–text2);margin-top:2px;}
.mpts{font-size:14px;font-weight:900;color:var(–gold);}

/* ══════ SCHEDULE ══════ */
.shift-card{background:var(–card2);border:1px solid var(–border);border-radius:13px;padding:13px;margin-bottom:7px;}
.shift-time{font-size:12px;color:var(–green);font-weight:700;}
.shift-title{font-size:14px;font-weight:700;margin-top:2px;}
.shift-members{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.shift-badge{background:rgba(61,220,132,.1);color:var(–green);border:1px solid rgba(61,220,132,.2);border-radius:7px;padding:3px 9px;font-size:11px;font-weight:700;}

/* ══════ LEADERBOARD ══════ */
.lb-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;background:var(–card2);border:1px solid var(–border);margin-bottom:5px;}
.lb-rank{font-size:18px;font-weight:900;width:28px;text-align:center;flex-shrink:0;}
.lb-bar-w{height:3px;background:var(–border);border-radius:3px;margin-top:3px;}
.lb-bar{height:3px;border-radius:3px;}
.lb-pts{font-size:16px;font-weight:900;color:var(–gold);flex-shrink:0;}

/* ══════ ATTENDANCE ══════ */
.att-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(–border);font-size:12px;}
.att-toggle-wrap{display:flex;gap:6px;}
.att-btn{padding:7px 13px;border-radius:9px;border:1px solid var(–border);background:var(–card2);color:var(–text2);font-weight:700;font-size:11px;cursor:pointer;font-family:‘Cairo’,sans-serif;transition:all .2s;}
.att-btn.p-on{background:rgba(61,220,132,.2);color:var(–green);border-color:rgba(61,220,132,.4);}
.att-btn.a-on{background:rgba(242,65,90,.15);color:var(–red);border-color:rgba(242,65,90,.3);}
.att-session-card{background:var(–card2);border:1px solid var(–border);border-radius:13px;padding:13px;margin-bottom:7px;}

/* ══════ STATS ══════ */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.stat-box{background:var(–card);border:1px solid var(–border);border-radius:14px;padding:14px;text-align:center;}
.stat-n{font-size:26px;font-weight:900;line-height:1;}
.stat-l{font-size:10px;color:var(–text3);margin-top:3px;}
.chart-wrap{position:relative;height:180px;}

/* ══════ LOG ══════ */
.log-item{padding:8px 0;border-bottom:1px solid var(–border);display:flex;gap:8px;}
.log-t{font-size:10px;color:var(–green);font-weight:700;white-space:nowrap;margin-top:2px;flex-shrink:0;}
.log-txt{font-size:11px;color:var(–text2);line-height:1.4;}

/* ══════ MODAL ══════ */
#modal-overlay{display:none;position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.88);backdrop-filter:blur(7px);padding:16px;align-items:flex-end;justify-content:center;}
#modal-overlay.open{display:flex;}
#modal-box{background:var(–card);border:1px solid var(–border2);border-radius:22px 22px 18px 18px;padding:22px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;animation:sup .28s ease;}
@keyframes sup{from{transform:translateY(80px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.mtitle{font-size:17px;font-weight:900;margin-bottom:14px;}
.mclose{background:var(–card2);border:1px solid var(–border);border-radius:9px;padding:10px;cursor:pointer;font-size:12px;color:var(–text2);font-family:‘Cairo’,sans-serif;font-weight:700;margin-top:12px;width:100%;display:block;}
.msec{margin-top:16px;padding-top:16px;border-top:1px solid var(–border);}
.msec-t{font-size:10px;color:var(–text3);font-weight:700;letter-spacing:1.5px;margin-bottom:7px;}

/* ══════ CONFIRM ══════ */
#conf-overlay{display:none;position:fixed;inset:0;z-index:25000;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:20px;}
#conf-overlay.open{display:flex;}
#conf-box{background:var(–card);border:1px solid var(–border2);border-radius:18px;padding:22px;width:100%;max-width:320px;text-align:center;}
.conf-t{font-size:16px;font-weight:900;margin-bottom:6px;}
.conf-m{font-size:12px;color:var(–text2);margin-bottom:18px;line-height:1.5;}
.conf-btns{display:flex;gap:8px;}
.conf-btns .btn{margin:0;}

/* ══════ TOAST ══════ */
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(16px);background:var(–card2);border:1px solid var(–border2);border-radius:12px;padding:11px 18px;font-size:13px;font-weight:700;z-index:30000;opacity:0;transition:all .28s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.s{border-color:rgba(61,220,132,.4);color:var(–green);}
#toast.e{border-color:rgba(242,65,90,.4);color:var(–red);}

/* ══════ GPS BUTTON ══════ */
.gps-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#054a28,#076b38);border:1px solid #0a8a47;border-radius:13px;padding:14px;cursor:pointer;color:var(–green3);font-weight:700;font-size:14px;font-family:‘Cairo’,sans-serif;width:100%;transition:all .2s;}
.gps-btn:active{transform:scale(.97);}
.gps-pulse{width:10px;height:10px;border-radius:50%;background:#4ade80;animation:pulse 1.5s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.4);}50%{box-shadow:0 0 0 7px rgba(74,222,128,0);}}

/* ══════ EMPTY STATE ══════ */
.empty{text-align:center;padding:32px 16px;color:var(–text3);font-size:13px;}
.empty-icon{font-size:36px;margin-bottom:8px;}

/* ══════ MANAGE SECTIONS ══════ */
.manage-tab-bar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.manage-tab{flex-shrink:0;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;background:var(–card2);border:1px solid var(–border);cursor:pointer;color:var(–text2);font-family:‘Cairo’,sans-serif;transition:all .2s;}
.manage-tab.active{background:rgba(61,220,132,.15);color:var(–green);border-color:rgba(61,220,132,.3);}

/* ══════ DUTY SCHEDULE ══════ */
.day-header{font-size:13px;font-weight:900;color:var(–gold);margin:12px 0 8px;display:flex;align-items:center;gap:8px;}
.day-header::after{content:’’;flex:1;height:1px;background:rgba(240,180,41,.2);}
</style>

</head>
<body>

<!-- LOGIN -->

<div id="login-screen">
  <div class="login-wrap">
    <div class="login-logo">أوتاد</div>
    <div class="login-tagline">نظام إدارة المعسكرات الكشفية</div>
    <div class="login-version">v2.0 · معسكرات الحج والتخييم</div>
    <div class="login-box">
      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot"></div><div class="pin-dot"></div>
        <div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div class="numpad">
        <button type="button" class="nb" onclick="PIN.p('1')">١</button>
        <button type="button" class="nb" onclick="PIN.p('2')">٢</button>
        <button type="button" class="nb" onclick="PIN.p('3')">٣</button>
        <button type="button" class="nb" onclick="PIN.p('4')">٤</button>
        <button type="button" class="nb" onclick="PIN.p('5')">٥</button>
        <button type="button" class="nb" onclick="PIN.p('6')">٦</button>
        <button type="button" class="nb" onclick="PIN.p('7')">٧</button>
        <button type="button" class="nb" onclick="PIN.p('8')">٨</button>
        <button type="button" class="nb" onclick="PIN.p('9')">٩</button>
        <button type="button" class="nb del" onclick="PIN.d()">⌫</button>
        <button type="button" class="nb" onclick="PIN.p('0')">٠</button>
        <button type="button" class="nb ok" onclick="PIN.s()">دخول</button>
      </div>
      <div class="login-err" id="login-err"></div>
    </div>
    <div class="login-reset" onclick="App.resetPrompt()">⚙ تهيئة النظام</div>
  </div>
</div>

<!-- APP -->

<div id="app">
  <div class="header">
    <div class="h-left">
      <div class="h-avatar" id="h-av" style="color:var(--green);border-color:var(--green);">؟</div>
      <div><div class="h-name" id="h-name">---</div><div class="h-meta" id="h-meta"></div></div>
    </div>
    <div class="h-right">
      <div class="ibtn" id="camp-indicator" onclick="App.tab('camps',document.querySelector('[data-tab=camps]'))">⛺ ---</div>
      <div class="ibtn" id="btn-logs" onclick="UI.showLogs()" style="display:none;">📋</div>
      <div class="ibtn" onclick="App.logout()">خروج</div>
    </div>
  </div>

  <div class="page active" id="page-home"></div>
  <div class="page" id="page-camps"></div>
  <div class="page" id="page-members"></div>
  <div class="page" id="page-attendance"></div>
  <div class="page" id="page-schedule"></div>
  <div class="page" id="page-leaderboard"></div>
  <div class="page" id="page-dashboard"></div>
  <div class="page" id="page-manage"></div>

  <nav id="main-nav">
    <div class="ni active" data-tab="home" onclick="App.tab('home',this)"><span class="ni-icon">🏠</span>الرئيسية</div>
    <div class="ni" data-tab="camps" onclick="App.tab('camps',this)"><span class="ni-icon">⛺</span>المعسكرات</div>
    <div class="ni" data-tab="members" onclick="App.tab('members',this)"><span class="ni-icon">👥</span>الأعضاء</div>
    <div class="ni" data-tab="attendance" onclick="App.tab('attendance',this)"><span class="ni-icon">📋</span>الحضور</div>
    <div class="ni" data-tab="schedule" onclick="App.tab('schedule',this)"><span class="ni-icon">🕐</span>المناوبات</div>
    <div class="ni" data-tab="leaderboard" onclick="App.tab('leaderboard',this)"><span class="ni-icon">🏆</span>الترتيب</div>
    <div class="ni hidden" id="nav-dashboard" data-tab="dashboard" onclick="App.tab('dashboard',this)"><span class="ni-icon">📊</span>القيادة</div>
    <div class="ni hidden" id="nav-manage" data-tab="manage" onclick="App.tab('manage',this)"><span class="ni-icon">🛡️</span>الإدارة</div>
  </nav>
</div>

<div id="modal-overlay" onclick="UI.closeModal(event)"><div id="modal-box"></div></div>
<div id="conf-overlay"><div id="conf-box">
  <div class="conf-t" id="conf-t"></div>
  <div class="conf-m" id="conf-m"></div>
  <div class="conf-btns">
    <button class="btn btn-ghost" style="flex:1;padding:12px;margin:0;" onclick="UI.confNo()">إلغاء</button>
    <button class="btn btn-r" id="conf-yes" style="flex:1;padding:12px;margin:0;" onclick="UI.confYes()">تأكيد</button>
  </div>
</div></div>
<div id="toast"></div>

<script>
/* ══════════════════════════════
   FIREBASE

const fbConfig = {
  apiKey: "AIzaSyA6P2gbckRDtKUqb8mVZcibXR4soZezFxE",
  databaseURL: "https://awtad-system-default-rtdb.firebaseio.com"
};

══════════════════════════════ */
const TC = ['#3ddc84','#4da6ff','#f0b429','#b58af5','#f2415a','#34d399','#ff8c42','#e879f9','#06b6d4','#84cc16'];
function tColor(n){ if(!n)return TC[0]; let h=0; for(let c of n) h=(h*31+c.charCodeAt(0))%TC.length; return TC[h]; }
function ini(n){ if(!n)return '؟'; const p=n.trim().split(' '); return(p[0][0]||'')+(p[1]?p[1][0]:''); }
function rgb(h){ return `${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`; }
function nowT(){ return new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}); }
function todayD(){ return new Date().toLocaleDateString('ar-SA'); }
function daysDiff(from,to){
  if(!from||!to)return 0;
  return Math.max(0,Math.round((new Date(to)-new Date(from))/(86400000)))+1;
}
function daysElapsed(from){
  if(!from)return 0;
  return Math.max(0,Math.round((Date.now()-new Date(from))/(86400000)))+1;
}

/* ══════════════════════════════
   PIN
══════════════════════════════ */
const PIN = {
  v:'', busy:false,
  p(n){ if(this.busy||this.v.length>=4)return; this.v+=n; this.upd(); if(this.v.length===4)setTimeout(()=>this.s(),220); },
  d(){ if(this.busy)return; this.v=this.v.slice(0,-1); this.upd(); },
  upd(){ document.querySelectorAll('.pin-dot').forEach((d,i)=>d.classList.toggle('on',i<this.v.length)); },
  async s(){
    if(this.busy)return; let p=this.v.trim(); if(!p)return;
    const err=document.getElementById('login-err'); err.textContent='';
    this.busy=true; document.querySelector('.nb.ok').style.opacity='.5';
    try{
      const snap=await DB.child('members').once('value');
      const mems=snap.val();
      if(!mems){ err.textContent='قاعدة البيانات فارغة. اضغط على "تهيئة النظام"'; this.v=''; this.upd(); return; }
      if(mems[p]){ S.user={...mems[p],id:p}; App.boot(); }
      else{ err.textContent=`الرمز غير صحيح`; this.v=''; this.upd(); }
    }catch(e){ err.textContent='تعذر الاتصال. تحقق من الإنترنت.'; this.v=''; this.upd(); }
    finally{ this.busy=false; document.querySelector('.nb.ok').style.opacity='1'; }
  }
};

const UI = {
  toast(msg,type='s'){
    const t=document.getElementById('toast');
    t.textContent=msg; t.className='show '+type;
    clearTimeout(this._tt); this._tt=setTimeout(()=>t.className='',2800);
  },
  openModal(html){ document.getElementById('modal-box').innerHTML=html; document.getElementById('modal-overlay').classList.add('open'); },
  closeModal(e){ if(!e||e.target.id==='modal-overlay') document.getElementById('modal-overlay').classList.remove('open'); },
  _cb:null,
  confirm(t,m,lbl,cb,danger=true){
    document.getElementById('conf-t').textContent=t;
    document.getElementById('conf-m').textContent=m;
    const yb=document.getElementById('conf-yes');
    yb.textContent=lbl; yb.className=`btn ${danger?'btn-r':'btn-g'}`; yb.style.flex='1'; yb.style.padding='12px'; yb.style.margin='0';
    this._cb=cb; document.getElementById('conf-overlay').classList.add('open');
  },
  confYes(){ document.getElementById('conf-overlay').classList.remove('open'); if(this._cb)this._cb(); this._cb=null; },
  confNo(){ document.getElementById('conf-overlay').classList.remove('open'); this._cb=null; },
  showLogs(){
    if(S.user.role!=='ROOT'){UI.toast('غير مصرح','e');return;}
    UI.openModal(`
      <div class="mtitle">📋 سجل العمليات</div>
      <div style="max-height:380px;overflow-y:auto;">
        ${S.logs.slice(0,80).map(l=>`<div class="log-item"><div class="log-t">${l.time}</div><div class="log-txt">${l.txt}</div></div>`).join('')||'<div class="empty">لا توجد سجلات</div>'}
      </div>
      <button class="mclose" onclick="UI.closeModal()">إغلاق</button>
    `);
  }
};

const App = {
  boot(){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    if(S.user.role==='ROOT'){
      document.getElementById('nav-dashboard').classList.remove('hidden');
      document.getElementById('nav-manage').classList.remove('hidden');
      document.getElementById('btn-logs').style.display='flex';
    }
    App.log(`دخل [${S.user.name}] إلى النظام`);
    App.sync();
  },

  sync(){
    DB.on('value',snap=>{
      const d=snap.val()||{};
      S.members     = d.members      || {};
      S.camps       = d.camps        || {};
      S.sessions    = d.sessions     || {};
      S.schedules   = d.schedules    || {};
      S.announcements=d.announcements|| {};
      S.tasks       = d.tasks        || {};
      S.logs        = Object.values(d.logs||{}).sort((a,b)=>b.ts-a.ts);

      // update active camp if still exists
      if(S.activeCampId && !S.camps[S.activeCampId]) S.activeCampId=null;
      if(!S.activeCampId){
        // auto-select first active camp
        const active=Object.entries(S.camps).find(([,c])=>c.status==='active');
        if(active) S.activeCampId=active[0];
        else{
          const any=Object.keys(S.camps)[0];
          if(any) S.activeCampId=any;
        }
      }

      // update current user
      const me=S.members[S.user.id];
      if(me){
        S.user={...me,id:S.user.id};
        document.getElementById('h-name').textContent=me.name;
        document.getElementById('h-meta').textContent=`${me.rank||''} · ${me.team||''}`;
        const c=tColor(me.team);
        const av=document.getElementById('h-av');
        av.textContent=ini(me.name); av.style.color=c; av.style.borderColor=c;
      }

      // update camp indicator
      const ci=document.getElementById('camp-indicator');
      if(S.activeCampId&&S.camps[S.activeCampId]){
        const camp=S.camps[S.activeCampId];
        ci.textContent=`⛺ ${camp.name}`;
      } else { ci.textContent='⛺ لا يوجد معسكر'; }

      Render[S.tab]&&Render[S.tab]();
    });
  },

  tab(name,el){
    S.tab=name;
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    const pg=document.getElementById('page-'+name);
    if(pg) pg.classList.add('active');
    document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));
    if(el) el.classList.add('active');
    else{
      const navEl=document.querySelector(`[data-tab="${name}"]`);
      if(navEl) navEl.classList.add('active');
    }
    Render[name]&&Render[name]();
  },

  log(txt){ DB.child('logs').push({txt,ts:Date.now(),time:nowT()}); },

    UI.confirm('تسجيل الخروج','هل تريد الخروج من النظام؟','خروج',()=>location.reload(true));

/* ══════════════════════════════
   RENDER ENGINE
══════════════════════════════ */
const Render = {

  /* ── HOME ── */
  home(){
    const me=S.members[S.user.id]; if(!me)return;
    const root=document.getElementById('page-home');
    const camp=S.activeCampId?S.camps[S.activeCampId]:null;

    // my attendance rate in active camp
    let myAtt=0,totalSess=0;
    if(camp){
      Object.values(S.sessions).filter(s=>s.campId===S.activeCampId).forEach(s=>{
        totalSess++;
        if(s.attendance&&s.attendance[S.user.id]) myAtt++;
      });
    }
    const attRate=totalSess?Math.round(myAtt/totalSess*100):0;

    // today's schedule
    const todayShifts=Object.values(S.schedules)
      .filter(sh=>sh.campId===S.activeCampId&&sh.date===new Date().toISOString().slice(0,10)&&sh.members&&sh.members.includes(S.user.id))
      .sort((a,b)=>a.time?.localeCompare(b.time));

    const anns=Object.values(S.announcements)
      .filter(a=>!a.campId||a.campId===S.activeCampId)
      .sort((a,b)=>b.ts-a.ts).slice(0,4);

    const myTasks=Object.values(S.tasks)
      .filter(t=>!t.done&&(t.assignedTo===S.user.id||t.assignedTo==='all')&&(!t.campId||t.campId===S.activeCampId));

    root.innerHTML=`
      ${camp?`
        <div class="camp-card ${camp.type==='hajj'?'hajj':'scout'}" style="margin-bottom:10px;cursor:default;">
          <div class="camp-type-tag" style="color:${camp.type==='hajj'?'var(--camp-hajj)':'var(--camp-scout)'};">
            ${camp.type==='hajj'?'🕌 معسكر خدمة الحج':'🏕 معسكر تخييم كشفي'}
          </div>
          <div class="camp-name">${camp.name}</div>
          <div class="camp-meta">
            <span>📅 ${camp.startDate||'---'} ← ${camp.endDate||'---'}</span>
            <span>📍 ${camp.location||'غير محدد'}</span>
          </div>
          <div class="camp-stats">
            <div class="camp-stat"><div class="camp-stat-n" style="color:var(--green);">${Object.values(S.members).filter(m=>m.campId===S.activeCampId||true).length}</div><div class="camp-stat-l">الأعضاء</div></div>
            <div class="camp-stat"><div class="camp-stat-n" style="color:var(--gold);">${me.pts||0}</div><div class="camp-stat-l">نقاطي</div></div>
            <div class="camp-stat"><div class="camp-stat-n" style="color:var(--blue);">${attRate}%</div><div class="camp-stat-l">حضوري</div></div>
          </div>
          ${camp.startDate&&camp.endDate?`
            <div class="camp-progress" style="margin-top:12px;">
              <div class="camp-progress-bar" style="width:${Math.min(100,Math.round(daysElapsed(camp.startDate)/daysDiff(camp.startDate,camp.endDate)*100))}%;background:${camp.type==='hajj'?'var(--gold)':'var(--green)'};"></div>
            </div>
            <div style="font-size:10px;color:var(--text3);margin-top:4px;text-align:center;">اليوم ${daysElapsed(camp.startDate)} من ${daysDiff(camp.startDate,camp.endDate)}</div>
          `:''}
        </div>
      `:`<div class="card"><div class="empty"><div class="empty-icon">⛺</div>لا يوجد معسكر نشط حالياً</div></div>`}

      ${todayShifts.length?`
        <div class="sec">🕐 مناوباتي اليوم</div>
        ${todayShifts.map(sh=>`
          <div class="shift-card">
            <div class="shift-time">${sh.time||'---'}</div>
            <div class="shift-title">${sh.title}</div>
            ${sh.location?`<div style="font-size:11px;color:var(--text3);margin-top:3px;">📍 ${sh.location}</div>`:''}
          </div>
        `).join('')}
      `:''}

      <div class="sec">📢 الإعلانات</div>
      <div class="card">
        ${anns.map(a=>`
          <div style="padding:10px 0;border-bottom:1px solid var(--border);">
            <div style="font-size:13px;line-height:1.5;">${a.text}</div>
            <div style="font-size:10px;color:var(--text3);margin-top:4px;">${a.author} · ${a.time}</div>
          </div>
        `).join('')||'<div class="empty" style="padding:12px;">لا توجد إعلانات</div>'}
      </div>

      ${myTasks.length?`
        <div class="sec">📝 مهامي (${myTasks.length})</div>
        ${myTasks.slice(0,3).map(t=>`
          <div class="card" style="padding:14px;">
            <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;">
              <div><div style="font-size:13px;font-weight:700;">${t.title}</div><div style="font-size:11px;color:var(--text2);margin-top:3px;">${t.desc||''}</div></div>
              <span class="badge bg-gold">+${t.pts||0} نقطة</span>
            </div>
            <button class="btn btn-g btn-sm" style="margin-top:10px;" onclick="Tasks.complete('${t.id}','${S.user.id}')">إنجاز ✓</button>
          </div>
        `).join('')}
      `:''}
    `;
  },

  /* ── CAMPS ── */
  camps(){
    const root=document.getElementById('page-camps');
    const isRoot=S.user.role==='ROOT';
    const campsArr=Object.entries(S.camps).sort((a,b)=>b[1].ts-a[1].ts);

    const html=campsArr.map(([id,c])=>`
      <div class="camp-card ${c.type==='hajj'?'hajj':'scout'} ${id===S.activeCampId?'active-camp':''}" onclick="Camps.open('${id}')">
        <div style="display:flex;justify-content:space-between;align-items:start;">
          <div class="camp-type-tag" style="color:${c.type==='hajj'?'var(--camp-hajj)':'var(--camp-scout)'};">
            ${c.type==='hajj'?'🕌 خدمة الحج':'🏕 تخييم كشفي'}
          </div>
          <span class="badge ${c.status==='active'?'bg-g':c.status==='ended'?'bg-r':'bg-gold'}">${c.status==='active'?'نشط':c.status==='ended'?'منتهي':'مخطط'}</span>
        </div>
        <div class="camp-name">${c.name}</div>
        <div class="camp-meta">
          <span>📅 ${c.startDate||'---'} ← ${c.endDate||'---'}</span>
          <span>📍 ${c.location||'غير محدد'}</span>
          <span>👥 ${c.memberCount||0} عضو</span>
        </div>
        ${id===S.activeCampId?`<div style="font-size:10px;color:var(--green);margin-top:8px;font-weight:700;">✓ المعسكر المحدد حالياً</div>`:''}
      </div>
    `).join('')||`<div class="card"><div class="empty"><div class="empty-icon">⛺</div>لا توجد معسكرات بعد${isRoot?'<br><small>اضغط على "معسكر جديد" لإنشاء أول معسكر</small>':''}</div></div>`;

    root.innerHTML=`
      ${isRoot?`
        <div style="display:flex;gap:8px;margin-bottom:4px;">
          <button class="btn btn-g btn-sm" style="flex:1;padding:12px;" onclick="Camps.showCreate('hajj')">🕌 معسكر حج</button>
          <button class="btn btn-ghost btn-sm" style="flex:1;padding:12px;" onclick="Camps.showCreate('scout')">🏕 معسكر تخييم</button>
        </div>
      `:''}
      <div class="sec">⛺ المعسكرات</div>
      ${html}
    `;
  },

  /* ── MEMBERS ── */
  members(){
    const root=document.getElementById('page-members');

},

allAbsent(){Object.keys(this._att).forEach(id=>this.tog(id,false));},

);

const Schedule = {
showAdd(){
if(!S.activeCampId){UI.toast(‘حدد معسكراً أولاً’,‘e’);return;}
const mems=Object.entries(S.members).filter(([,m])=>!m.archived);
const camp=S.camps[S.activeCampId];
UI.openModal(` <div class="mtitle">➕ مناوبة جديدة</div> <label>عنوان المناوبة</label> <input id="sh-title" placeholder="استقبال حجاج، توزيع وجبات، تنظيم..."> <label>الموقع</label> <input id="sh-loc" placeholder="منطقة أ، بوابة ٣..."> <label>التاريخ</label> <input id="sh-date" type="date" value="${camp?.startDate||new Date().toISOString().slice(0,10)}"> <label>الوقت</label> <input id="sh-time" type="time"> <label>الأعضاء المكلفون</label> <div id="sh-members" style="margin-top:8px;max-height:180px;overflow-y:auto;"> ${mems.map(([id,m])=>`
<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);">
<input type="checkbox" id="shm-${id}" style="width:auto;margin:0;accent-color:var(--green);">

`).join('')} </div> <label>ملاحظات</label> <textarea id="sh-notes" placeholder="تعليمات خاصة..."></textarea> <button class="btn btn-g" onclick="Schedule.add()">إضافة المناوبة ✓</button> <button class="mclose" onclick="UI.closeModal()">إغلاق</button> `);
},

UI.toast(‘تم الحذف’); UI.closeModal();
});
},

showBulk(){
if(!S.activeCampId){UI.toast(‘حدد معسكراً أولاً’,‘e’);return;}
const camp=S.camps[S.activeCampId];
UI.openModal(`<div class="mtitle">📋 توليد مناوبات يومية</div> <p style="font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.6;"> يوّلد مناوبات لكل طليعة يومياً طوال المعسكر تلقائياً </p> <label>عنوان المناوبة</label> <input id="bk-title" placeholder="مناوبة يومية"> <label>وقت البداية</label> <input id="bk-time" type="time" value="08:00"> <label>موقع المناوبة</label> <input id="bk-loc" placeholder="موقع التكليف"> <button class="btn btn-g" onclick="Schedule.genBulk()">توليد المناوبات ✓</button> <button class="mclose" onclick="UI.closeModal()">إغلاق</button>`);
},

async genBulk(){
const camp=S.camps[S.activeCampId];
if(!camp||!camp.startDate||!camp.endDate){UI.toast(‘المعسكر بلا تواريخ’,‘e’);return;}
const title=document.getElementById(‘bk-title’)?.value.trim()||‘مناوبة يومية’;
const time=document.getElementById(‘bk-time’)?.value||‘08:00’;
const loc=document.getElementById(‘bk-loc’)?.value.trim()||’’;
const teams=[…new Set(Object.values(S.members).filter(m=>!m.archived).map(m=>m.team))];
const start=new Date(camp.startDate); const end=new Date(camp.endDate);
let count=0;
for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
const dateStr=d.toISOString().slice(0,10);
for(const team of teams){
const mems=Object.keys(S.members).filter(id=>S.members[id].team===team&&!S.members[id].archived);
if(!mems.length)continue;
const id=Date.now().toString()+Math.random().toString(36).slice(2);
await DB.child(‘schedules’).child(id).set({
id,title:`${title} — ${team}`,location:loc,date:dateStr,time,
members:mems,campId:S.activeCampId,ts:Date.now(),createdBy:S.user.name
});
count++;
await new Promise(r=>setTimeout(r,20));
}
}
App.log(`${S.user.name} ولّد ${count} مناوبة جماعية`);
UI.toast(`تم توليد ${count} مناوبة ✓`); UI.closeModal();
}
};

const Tasks = {
_busy:new Set(),
complete(taskId,userId){
if(this._busy.has(taskId))return;
this._busy.add(taskId);
const t=S.tasks[taskId]; if(!t||t.done){this._busy.delete(taskId);return;}
DB.child(‘tasks’).child(taskId).update({done:true,completedBy:userId,completedAt:Date.now()});
DB.child(‘members’).child(userId).update({pts:(S.members[userId].pts||0)+(t.pts||0)});
App.log(`${S.members[userId].name} أنجز [${t.title}] +${t.pts||0} نقطة`);
UI.toast(`أحسنت! +${t.pts||0} نقطة 🎉`);
setTimeout(()=>this._busy.delete(taskId),3000);
}
};
